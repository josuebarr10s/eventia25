openapi: 3.1.1
info:
  title: Eventia API segura (contrato local)
  version: 1.0.0
  description: >-
    Contrato académico de tres operaciones reales del backend actual. El servidor es
    local; la autorización real se implementa en Django REST Framework.
servers:
  - url: http://127.0.0.1:8000
    description: Desarrollo local; no usar como host de producción.
tags:
  - name: Eventos
  - name: Inscripciones
security:
  - accessBearer: []
paths:
  /api/events/:
    post:
      tags: [Eventos]
      operationId: createEvent
      summary: Crear borrador de evento como organizador autorizado
      description: >-
        El servidor asigna organizer al usuario autenticado y crea el evento en
        estado draft. Se requiere events.add_event. No se aceptan organizer, status
        ni otras propiedades fuera de la allowlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
            examples:
              valid:
                value:
                  title: Feria de tecnología
                  description: Encuentro de innovación local.
                  category: technology
                  starts_at: '2027-05-12T18:00:00Z'
                  city: Ciudad de Guatemala
                  location: Centro cultural
                  capacity: 120
              forbiddenRoleAndOwner:
                summary: Campos de control que el cliente no puede asignar
                value:
                  title: Evento manipulado
                  description: Prueba de asignación masiva.
                  category: technology
                  starts_at: '2027-05-12T18:00:00Z'
                  city: Ciudad de Guatemala
                  location: Centro cultural
                  capacity: 120
                  organizer: 1
                  status: published
      responses:
        '201':
          description: Evento creado como borrador del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Se presentó un access JWT inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Falta permiso para crear (incluye petición anónima a esta acción).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/registrations/:
    post:
      tags: [Inscripciones]
      operationId: registerForEvent
      summary: Inscribir la cuenta autenticada en un evento publicado
      description: >-
        El cuerpo solo admite event_id; la identidad se deriva del JWT y cada
        cuenta puede tener una inscripción por evento. La reserva y comprobación
        de cupo son atómicas. El endpoint aplica 20 intentos por usuario y hora
        en la caché configurada; con LocMemCache el límite es por proceso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCreate'
            examples:
              valid:
                value: {event_id: 25}
              forbiddenQuantityAndUser:
                summary: No se permite elegir cantidad ni suplantar al usuario
                value: {event_id: 25, quantity: 500, user_id: 7}
      responses:
        '201':
          description: Inscripción confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: El evento no existe, no está publicado o no es visible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya está inscrito o no quedan cupos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/registrations/{id}/:
    get:
      tags: [Inscripciones]
      operationId: getOwnRegistration
      summary: Consultar una inscripción propia
      description: >-
        La consulta se filtra por request.user; una inscripción de otra cuenta
        responde 404. No existe una ruta pública por ID de usuario.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador decimal de la inscripción.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Inscripción propia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No existe o no pertenece al usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    accessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de corta duración; el refresh se guarda en cookie HttpOnly.
  responses:
    BadRequest:
      description: JSON inválido, propiedad desconocida o regla de validación incumplida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Falta un access token válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: La cuenta autenticada no tiene permiso para la función solicitada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Límite temporal excedido; se incluye Retry-After.
      headers:
        Retry-After:
          description: Segundos restantes estimados en la ventana actual.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
        fields:
          type: object
          additionalProperties: true
      additionalProperties: true
    EventCreate:
      type: object
      additionalProperties: false
      required: [title, description, category, starts_at, city, location, capacity]
      properties:
        title:
          type: string
          maxLength: 180
        description:
          type: string
          maxLength: 10000
        category:
          type: string
          enum: [culture, music, technology, wellness, community]
        starts_at:
          type: string
          format: date-time
          description: Debe ser posterior a la hora actual del servidor.
        city:
          type: string
          maxLength: 120
        location:
          type: string
          maxLength: 255
        capacity:
          type: integer
          minimum: 1
          maximum: 1000000
    Event:
      type: object
      required: [id, title, description, category, category_label, starts_at, city, location, capacity, organizer_name, status, created_at, registered_count, available_spots, is_registered, can_edit, can_publish, is_demo]
      properties:
        id: {type: integer}
        title: {type: string}
        description: {type: string}
        category: {type: string, enum: [culture, music, technology, wellness, community]}
        category_label: {type: string}
        starts_at: {type: string, format: date-time}
        city: {type: string}
        location: {type: string}
        capacity: {type: integer, minimum: 1}
        organizer_name: {type: string}
        status: {type: string, enum: [draft, published]}
        created_at: {type: string, format: date-time}
        registered_count: {type: integer, minimum: 0}
        available_spots: {type: integer, minimum: 0}
        is_registered: {type: boolean}
        can_edit: {type: boolean}
        can_publish: {type: boolean}
        is_demo: {type: boolean}
    RegistrationCreate:
      type: object
      additionalProperties: false
      required: [event_id]
      properties:
        event_id:
          type: integer
          minimum: 1
    Registration:
      type: object
      required: [id, event, created_at, status, notification_status]
      properties:
        id: {type: integer}
        event:
          $ref: '#/components/schemas/Event'
        created_at: {type: string, format: date-time}
        status:
          type: string
          enum: [confirmed]
        notification_status:
          type: string
          enum: [pending, sent, console, failed]
